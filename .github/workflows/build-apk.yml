# 工作流名称
name: Build Android APK

# 触发条件：允许我们手动点击按钮来运行
on:
  workflow_dispatch:

# 任务定义
jobs:
  build:
    # 运行环境：使用最新的 Ubuntu 系统
    runs-on: ubuntu-latest

    # 步骤
    steps:
      # 第一步：拉取你的仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第二步：设置 Java 环境 (安卓编译需要)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 第三步：设置 Gradle 缓存 (加速编译)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 第四步：执行 Gradle 编译命令来构建 Debug 版本的 APK
      # 'assembleDebug' 会生成一个用于测试和个人安装的 APK 文件
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 第五步：上传编译好的 APK 文件作为产物 (Artifact)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # 产物的名称
          name: xiaozhi-debug-apk
          # 要上传的文件路径
          # 注意: 'app/build/outputs/apk/debug/app-debug.apk' 是安卓项目的标准输出路径
          path: app/build/outputs/apk/debug/app-debug.apk
